<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basicForms</title>
</head>
<body>
  <fieldset>
    <legend align = "center">Basic form</legend>
    <form>
    <label for = "Fullname">Fullname</label>
    <input 
        type = "text" 
        name = "yourname" 
        id = "fullname"
         placeholder = "enter your name"
     />
    
    <br />
    <br/>
    <label for = "email">email</label>
    <input  
        type = "email" 
        name = "youremail" 
        id = "email"
    />


    <br />
    <br/>
    <label for = "password">password</label>
    <input 
         type = "password" 
         name = "password" 
         id = "password" 
         placeholder = "enter your password"
    />


    <br />
    <br/>
    <label for = " confirm password">confirm password</label>
    <input type = "cfpassword" 
         name = "cfpassword" 
         id = "cfpassword" 
         placeholder = "enter your cfpassword"
         />


    <br/>
    <br/>
    <label for = "dob">date of birth</label>
    <input
    type = "date"
    name = "dob"
    id = "dob"
    />

    <br/>
    <br/>
    <label for = "time"> time</label>
    <input
    type = "time"
    name = "time"
    id = "time"
    />
=
    <br/>
    <br/>
    <label for = "joining time">joining time</label>
    <input
    type = "date time local"
    name = "joining time"
    id = "joining time"
    />

    <br/>
    <br/>
    <label for = "volume">volume</label>
    <input
    type = "range"
    name = "volume"
    id = "volume"
    min = "0"
    max = "10"
    value = "3"
    />

    <br/>
    <br/>
    <label for = "mobile">mobile</label>
    <input
    type = "number"
    name = "mobile"
    id = "mobile"
    min = "0"
    max = "10"
    />

     <br/>
    <br/>
    <label for = "resume">resume</label>
    <input
    type = "file"
    name = "resume"
    id = "resume"
    
    />

    <br/>
    <br/>
    <label for = "address">Address</label>
    <textarea name="address" id="address"></textarea>

    <br/>
    <br/>
    <label for = "course">course</label>
    <select name="course" id="course">
    <option value=">==Select course--<"/option>
    <option value="bba">BBA</option>
    <option value="mtech">MTECH</option>
    <option value="mba">MBA</option>
    <option value="btech">BTECH</option>
    </select>
   
     <br/>
    <br/>
    <label for = "gender">gender</label>
    <input type = "radio" name = "gender" id = "mALE " value = "male">
    <span>Male</span>
     <input type = "radio" name = "gender" id = "FEmALE " value = "FEmale">
    <span>FeMale</span>
     <input type = "radio" name = "gender" id = "others" value = "others">
    <span>others</span>

     <br/>
    <br/>
    <label for = "checkbox">skillset</label>
    <input type = "checkbox" name = "skillset" id = "JAVA" value = "male">
    <span>JAVA</span>
     <input type = "checkbox" name = "skillset" id = "DSA" value = "FEmale">
    <span>DSA</span>
     <input type = "checkbox" name = "skillset" id = "html" value = "">
    <span>HTML</span>

    <br/>
    <br/>
    <button>submit</button>
    <button>Reset</button>

   </form>
  </fieldset>





   
</body>
</html>
