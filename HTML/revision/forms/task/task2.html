    <fieldset>
    <h1>Pizza Order Form</h1>
    <label for = "Firstname">Firstname:</label>
    <input 
         type = "Firstname" 
         name = "Firstname" 
         id = "Firstname" 
         placeholder = "enter your name"
    />
    <br />
    <br/>
    <label for = "Lastname">Lastname:</label>
    <input 
         type = "Lastname" 
         name = "Lastname" 
         id = "Lastname" 
         placeholder = "enter your name"
    />
   <br />
    <br/>
    <label for = "emailaddress">emailaddress:</label>
    <input  
        type = "emailaddress" 
        name = "youremailaddress" 
        id = "emailaddress"
    />
   <br/>
    <br/>
    <label for = "contact number">contact number:</label>
    <input
    type = "number"
    name = "contact number"
    id = "contact number"
    min = "0"
    max = "10"
    />

    <br/>
    <br/>
    <label for = "preferred delivery date">preferred delivery date:</label>
    <input
    type = "date"
    name = "pdd"
    id = "pdd"
    />

    <br/>
    <br/>
    <label for = "size:">size:</label>
    <br>
    <input type = "radio" name = "small" id = "small " >
    <span>Small</span>
     <input type = "radio" name = "medium" id = "medium " >
    <span>medium</span>
     <input type = "radio" name = "large" id = "large" >
    <span>large</span>

    <br/>
    <br/>
    <label for = "checkbox">flavor:</label>
    <br>
    <input type = "checkbox" name = "flavor:" id = "Hawaiian(php 150.00)" value = "number" min = "0" max = "10">
    <span>Hawaiian(php 150.00)</span>
    <br>
     <input type = "checkbox" name = "flavor:" id = "Pepperoni(php 140.00)" value = "number" min = "0" max = "10">
    <span>Pepperoni(php 140.00)</span>
    <br>
    <input type = "checkbox" name = "flavor:" id = "vegetable(php 130.00)" value = "number" min = "0" max = "10">
    <span>Vegetable(php 130.00)</span>

    <br/>
    <br/>
    <label for = "Credit card number">Credit card number:</label>
    <input
    type = "number"
    name = "Credit card number"
    id = "Credit card number"
    />

     <br/>
    <br/>
    <label for = "PIN">PIN:</label>
    <input
    type = "PIN"
    name = "PIN"
    id = "PIN"
    />
    
     <br/>
    <br/>
    <label for = "additional note">Additional Note:</label>
    <br>
    <textarea name="additional note" id="additional note"></textarea>

    <br/>
    <br/>
    <button >submit order</button>
