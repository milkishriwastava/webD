<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body bgcolor="lightcyan">
    <h1> <legend align = "center">Task 6:</legend></h1>
    <h2>
    <b>
         Create an HTML table as shown in given image.Use only pure HTML codes.
           
    </b>
   </h2>
   

    
</head>

<body>

    <div class="container">

         
        
         <img src="./doctor image.jpg" alt="" width = "190px" height = "px">

        
        <div class="form-section">

            <h2>Doctor Appointment Form</h2>

            <form>

                <div class="form-group">
                    <label>Appointment Date</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Appointment Time</label>
                    <input type="time">
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name" style="margin-left: 15px;">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender">
                        Male
                        <input type="radio" name="gender" value="male">

                        Female
                        <input type="radio" name="gender" value="female">
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" placeholder="Phone Number">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" placeholder="City">
                    <input type="text" placeholder="State" style="margin-left: 15px;">
                </div>

                <div class="form-group">
                    <label>Your Query</label>
                    <textarea placeholder="Enter your query"></textarea>
                </div>

                <div class="form-group">
                    <label>Appointment Type</label>

                    <div class="checks">
                        <b>Select which type of appointment(s) you require:</b><br>

                        <label>
                            <input type="checkbox" name="appointment">
                            Cervix checkup
                        </label><br>

                        <label>
                            <input type="checkbox" name="appointment">
                            Heart checkup
                        </label><br>

                        <label>
                            <input type="checkbox" name="appointment">
                            Eye checkup
                        </label><br>

                        <label>
                            <input type="checkbox" name="appointment">
                            Hearing Test
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Send
                </button>

            </form>

        </div>
    </div>
